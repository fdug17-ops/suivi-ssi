name: Mes Calories (APK Android)

on:
  push:
    paths:
      - "MesCalories/**"
      - ".github/workflows/mescalories.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MesCalories
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.MESCALORIES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mescalories.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/mescalories.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret MESCALORIES_KEYSTORE_BASE64 absent : APK signé avec une clé de debug temporaire."
          fi

      - name: Compiler l'APK
        env:
          SIGNING_PASSWORD: ${{ secrets.MESCALORIES_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MesCalories.apk

      - name: Archiver l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MesCalories-apk
          path: MesCalories/MesCalories.apk

      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mescalories-latest --cleanup-tag --yes || true
          gh release create mescalories-latest MesCalories.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Mes Calories – dernière version (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK compilé automatiquement depuis la branche ${GITHUB_REF_NAME}. Ouvrez ce lien depuis le téléphone et installez MesCalories.apk."
